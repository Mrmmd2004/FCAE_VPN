name: Clubapp Windows

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-hev-windows:
    name: hev-socks5-tunnel engine DLL (windows)
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            gcc
      - name: build hev-socks5-tunnel DLL (MSYS)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "toolchain: $(gcc -dumpmachine) -- $(gcc --version | head -1)"
          make -C core/hev-socks5-tunnel tp-static -j"$(nproc)"
          ENG=core/hev-socks5-tunnel
          mkdir -p "$ENG/build-compat"
          cat > "$ENG/build-compat/fcae-msys-compat.c" <<'EOF'
          #include <io.h>
          #include <stdint.h>
          #ifdef get_osfhandle
          #undef get_osfhandle
          #endif
          intptr_t _get_osfhandle (int fd);
          intptr_t get_osfhandle (int fd)
          {
              return _get_osfhandle (fd);
          }
          EOF
          gcc -O2 -c "$ENG/build-compat/fcae-msys-compat.c" -o "$ENG/build-compat/fcae-msys-compat.o"
          LDFLAGS_HEV="-Wl,--export-all-symbols \
            $PWD/$ENG/build-compat/fcae-msys-compat.o \
            $PWD/$ENG/third-part/yaml/bin/libyaml.a \
            $PWD/$ENG/third-part/lwip/bin/liblwip.a \
            $PWD/$ENG/third-part/hev-task-system/bin/libhev-task-system.a"
          if [ -n "${MSYSTEM:-}" ]; then
            make -C "$ENG" shared -j"$(nproc)" LFLAGS="$LDFLAGS_HEV"
          else
            make -C "$ENG" shared -j"$(nproc)" LFLAGS="$LDFLAGS_HEV -lws2_32 -lIphlpapi"
          fi
          test -s core/hev-socks5-tunnel/bin/libhev-socks5-tunnel.so
          test -s core/hev-socks5-tunnel/third-part/yaml/bin/libyaml.so
          test -s core/hev-socks5-tunnel/third-part/lwip/bin/liblwip.so
          test -s core/hev-socks5-tunnel/third-part/hev-task-system/bin/libhev-task-system.so
          mkdir -p engine
          mv core/hev-socks5-tunnel/bin/libhev-socks5-tunnel.so engine/libhev-socks5-tunnel.dll
          cp -v core/hev-socks5-tunnel/third-part/yaml/bin/libyaml.so engine/
          cp -v core/hev-socks5-tunnel/third-part/lwip/bin/liblwip.so engine/
          cp -v core/hev-socks5-tunnel/third-part/hev-task-system/bin/libhev-task-system.so engine/
          if command -v ldd >/dev/null 2>&1; then
            for dll in engine/libhev-socks5-tunnel.dll engine/*.so; do
              ldd "$dll" |
                awk '$3 ~ /^\/usr\/bin\// { print $3 }' | sort -u |
                while read -r lib; do
                  cp -v "$lib" engine/
                done
            done
          fi
          if [ -n "${MSYSTEM:-}" ]; then
            test -s engine/msys-2.0.dll
          fi
          ls -l engine
      - name: hand the engine DLL to the windows-x64 leg
        uses: actions/cache/save@v6
        with:
          path: engine
          key: hev-windows-engine-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  build:
    name: Clubapp windows-x64
    needs: [build-hev-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FCAE_VERSION: "1.0.0"
      FCAE_VERSION_FULL: "1.0.0"
      FCAE_IS_PRERELEASE: "false"
      TARGET: x86_64-pc-windows-gnu
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      # ---- Clubapp branding: name, icon, Telegram link, no links to the original author ----
      - name: apply Clubapp branding
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          pip install pillow numpy
          curl -fsSL -o /tmp/clubapp_icon.png \
            "https://raw.githubusercontent.com/Mrmmd2004/Clubapp/main/icon.png"
          python3 - <<'PY'
          import os, re
          import numpy as np
          from collections import deque
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          SRC = "/tmp/clubapp_icon.png"
          N = 1024
          # ---------------------------------------------------------------- master icon
          a = np.asarray(Image.open(SRC).convert("RGBA")).astype(float)
          rgb = a[..., :3]
          H, W = rgb.shape[:2]
          # white corners (connected to the 4 corners) are not part of the icon
          isw = rgb.min(axis=2) >= 245
          seen = np.zeros((H, W), bool)
          dq = deque([(0, 0), (0, W - 1), (H - 1, 0), (H - 1, W - 1)])
          for p in dq:
              seen[p] = True
          while dq:
              y, x = dq.popleft()
              for dy, dx in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  ny, nx = y + dy, x + dx
                  if 0 <= ny < H and 0 <= nx < W and not seen[ny, nx] and isw[ny, nx]:
                      seen[ny, nx] = True
                      dq.append((ny, nx))
          body_obs = ~seen
          def rr_mask(r, size, ss=4):
              big = Image.new("L", (size * ss, size * ss), 0)
              ImageDraw.Draw(big).rounded_rectangle((0, 0, size * ss - 1, size * ss - 1), radius=r * ss * 1.0, fill=255)
              return np.asarray(big.resize((size, size), Image.LANCZOS)).astype(float) / 255
          R = min(range(10, 90), key=lambda r: np.abs((rr_mask(r, W) > 0.5) ^ body_obs).sum())
          print("corner radius:", R)
          yy, xx = np.mgrid[0:H, 0:W]
          u, v = xx / (W - 1), yy / (H - 1)
          def feats(u, v, deg=4):
              return np.stack([u**i * v**j for i in range(deg + 1) for j in range(deg + 1 - i)], axis=-1)
          white = rgb.min(axis=2)
          inner = (rr_mask(R, W) > 0.999) & (np.abs(xx - W / 2) < W / 2 - 6) & (np.abs(yy - H / 2) < H / 2 - 6)
          txt = np.asarray(Image.fromarray(((white >= 90) & inner).astype(np.uint8) * 255).filter(ImageFilter.MaxFilter(7))) > 0
          bgpix = inner & (white < 90) & ~txt
          A = feats(u[bgpix], v[bgpix])
          coef = [np.linalg.lstsq(A, rgb[..., c][bgpix], rcond=None)[0] for c in range(3)]
          U, V = np.meshgrid(np.linspace(0, 1, N), np.linspace(0, 1, N))
          F = feats(U, V)
          bg = np.stack([np.clip(F @ coef[c], 0, 255) for c in range(3)], axis=-1)
          # text = white pixels in the middle band only (keeps corner/edge noise out)
          wl = np.clip((white - 60) / (250 - 60), 0, 1)
          band = np.zeros((H, W), bool)
          band[int(H * 0.25):int(H * 0.8), int(W * 0.03):int(W * 0.97)] = True
          wl[~(inner & band)] = 0
          w_up = np.asarray(Image.fromarray((wl * 255).astype(np.uint8)).resize((N, N), Image.BICUBIC)).astype(float) / 255
          m = np.clip((w_up - 0.5) * 3.2 + 0.5, 0, 1)
          m = m * m * (3 - 2 * m)
          bg_img = Image.fromarray(bg.astype(np.uint8), "RGB").convert("RGBA")                 # full-bleed gradient
          txt_img = Image.merge("RGBA", [Image.new("L", (N, N), 255)] * 3 + [Image.fromarray((m * 255).astype(np.uint8))])
          big = Image.new("L", (N * 2, N * 2), 0)
          ImageDraw.Draw(big).rounded_rectangle((0, 0, N * 2 - 1, N * 2 - 1), radius=R * (N / W) * 2, fill=255)
          round_alpha = big.resize((N, N), Image.LANCZOS)
          icon_full = Image.alpha_composite(bg_img, txt_img)                                    # gradient + text
          icon_full.putalpha(round_alpha)                                                       # transparent corners
          def legacy(size, circle):
              img = icon_full.resize((size, size), Image.LANCZOS)
              if circle:
                  mask = Image.new("L", (size * 4, size * 4), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
                  mask = mask.resize((size, size), Image.LANCZOS)
                  img.putalpha(ImageChops.multiply(img.getchannel("A"), mask))
              return img
          # ------------------------------------------------ replace desktop icons
          SKIP = {"target", "build", ".gradle", "third_party", "node_modules", ".git", "third-part"}
          BASES = ("src_cpp", "include", "core/fcae-ffi")
          img_all, img_changed = [], []
          for base in BASES:
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in SKIP]
                  for f in files:
                      low = f.lower()
                      if not low.endswith((".png", ".ico", ".jpg", ".jpeg", ".bmp")):
                          continue
                      p = os.path.join(d, f)
                      try:
                          im = Image.open(p)
                          w, h = im.size
                      except Exception:
                          continue
                      img_all.append("%s (%dx%d)" % (p, w, h))
                      if not re.search(r"icon|logo|splash|app|fcae|brand", low):
                          continue
                      if low.endswith(".ico"):
                          try:
                              sizes = sorted(im.info.get("sizes") or {(w, h)})
                          except Exception:
                              sizes = [(w, h)]
                          icon_full.save(p, format="ICO", sizes=list(sizes))
                          img_changed.append(p + " (ico " + str(sizes) + ")")
                      elif low.endswith(".png"):
                          side = min(w, h)
                          canvas = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                          canvas.paste(legacy(side, False), ((w - side) // 2, (h - side) // 2))
                          canvas.save(p)
                          img_changed.append("%s (%dx%d)" % (p, w, h))
          print("Image files found in source folders:", len(img_all))
          for x in sorted(img_all):
              print("  ", x)
          print("Icons replaced:", len(img_changed))
          for x in img_changed:
              print("  ", x)
          # ------------------------------------------------ name + Telegram + creator links
          REPO = os.environ.get("REPO_SLUG", "Mrmmd2004/FCAE_VPN")
          PAGE = re.compile(r'https?://(?:www\.)?github\.com/FCFlenkchy[^\s"\'<>)\\]*', re.I)
          TME = re.compile(r'https?://t\.me/[A-Za-z0-9_+]+')
          EXT = (".cpp", ".cc", ".c", ".h", ".hpp", ".mm", ".rc", ".rs", ".in", ".manifest")
          files_to_edit = ["CMakeLists.txt"]
          for base in BASES:
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in SKIP]
                  for f in files:
                      if f.endswith(EXT) or f == "CMakeLists.txt":
                          files_to_edit.append(os.path.join(d, f))
          edited, tme_found, left_name, left_creator = [], set(), [], []
          for p in files_to_edit:
              try:
                  t = open(p, encoding="utf-8").read()
              except Exception:
                  continue
              n = t
              if not p.startswith("core/"):
                  n = n.replace("FCAE VPN", "Clubapp")
              tme_found.update(TME.findall(n))
              n = TME.sub("https://t.me/Clubapp8", n)
              n = PAGE.sub("https://t.me/Clubapp8", n)
              n = re.sub(r"FCFlenkchy/FCAE_VPN", REPO, n, flags=re.I)
              if n != t:
                  open(p, "w", encoding="utf-8").write(n)
                  edited.append(p)
              for i, line in enumerate(n.splitlines(), 1):
                  if re.search(r"fcflenkchy", line, re.I):
                      left_creator.append("%s:%d: %s" % (p, i, line.strip()[:110]))
                  elif not p.startswith("core/") and re.search(r"fcae", line, re.I):
                      left_name.append("%s:%d: %s" % (p, i, line.strip()[:110]))
          print("Files edited:", len(edited))
          for p in edited:
              print("  ", p)
          print("Telegram links found and replaced:", sorted(tme_found))
          print("Lines still mentioning the creator:", len(left_creator))
          for l in left_creator[:40]:
              print("  ", l)
          print("Lines still containing 'FCAE' (for a second pass):", len(left_name))
          for l in left_name[:60]:
              print("  ", l)
          PY
      - name: restore hev engine DLL
        uses: actions/cache/restore@v6
        with:
          path: engine
          key: hev-windows-engine-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: publish hev engine DLL
        run: |
          set -euo pipefail
          ENGINE="$GITHUB_WORKSPACE/engine"
          test -s "$ENGINE/libhev-socks5-tunnel.dll"
          test -s "$ENGINE/msys-2.0.dll"
          echo "FCAE_HEV_DLL=$ENGINE/libhev-socks5-tunnel.dll" >> "$GITHUB_ENV"
          echo "FCAE_HEV_ENGINE_DIR=$ENGINE" >> "$GITHUB_ENV"
          ls -la "$ENGINE"
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'core/psiphon/go.mod'
          cache: false

      - name: pin go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          go version
          go env GOTOOLCHAIN
      - name: install deps (windows cross-compiler)
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do
            echo "waiting for boot-time apt processes to release locks..."
            sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm \
            cmake ninja-build
          which x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++
          x86_64-w64-mingw32-gcc --version | head -1
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rust-src

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
          workspaces: |
            core -> target
          cache-on-failure: true

      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi
      - name: cache zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig-0.16.0
          key: zig-0.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: setup zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.16.0
          TUPLE=x86_64-linux
          SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ARCHIVE="zig-${TUPLE}-${ZIG_VER}.tar.xz"
          PREFIX="${RUNNER_TOOL_CACHE}/zig-${ZIG_VER}"
          mkdir -p "$PREFIX"
          if [ ! -x "${PREFIX}/zig" ]; then
            URLS=(
              "https://ziglang.org/download/${ZIG_VER}/${ARCHIVE}"
              "https://ziglang.freetls.fastly.net/${ARCHIVE}"
              "https://pkg.hexops.org/zig/${ARCHIVE}"
              "https://zig.linus.dev/zig/${ARCHIVE}"
              "https://zig.squirl.dev/${ARCHIVE}"
              "https://zig.mirror.mschae23.de/zig/${ARCHIVE}"
              "https://zigmirror.com/${ARCHIVE}"
              "https://zig.tilok.dev/${ARCHIVE}"
              "https://zigmirror.hryx.net/zig/${ARCHIVE}"
            )
            if list=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 \
                 https://ziglang.org/download/community-mirrors.txt 2>/dev/null); then
              while IFS= read -r base; do
                [ -n "$base" ] || continue
                URLS+=("${base%/}/${ARCHIVE}")
              done <<< "$list"
            fi
            TMP="${RUNNER_TEMP}/${ARCHIVE}"
            ok=0
            seen=
            for url in "${URLS[@]}"; do
              case " $seen " in *" $url "*) continue ;; esac
              seen+=" $url"
              echo "Trying $url"
              rm -f "$TMP"
              if curl -fL --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 20 --max-time 180 -o "$TMP" "$url" \
                   && [ "$(sha256sum "$TMP" | awk '{print $1}')" = "$SHA" ]; then
                ok=1
                break
              fi
              echo "failed: $url"
            done
            if [ "$ok" != 1 ]; then
              echo "::error::failed to download Zig ${ZIG_VER} from every mirror"
              exit 1
            fi
            tar -xJf "$TMP" -C "$PREFIX" --strip-components=1
            rm -f "$TMP"
          fi
          echo "$PREFIX" >> "$GITHUB_PATH"
          "${PREFIX}/zig" version
      - name: build zeptun engine (libzeptun)
        shell: bash
        run: |
          set -euo pipefail
          cd core/zeptun
          # Static and shared Windows artifacts otherwise share a basename;
          # the DLL import library can overwrite the static archive.
          sed -i 's/\.name = if (target\.result\.abi == \.msvc) "zeptun_static" else "zeptun"/.name = "fcae_zeptun_static"/' build.zig
          zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSmall
          STATIC_ZEPTUN=""
          for candidate in zig-out/lib/libfcae_zeptun_static.a zig-out/lib/libfcae_zeptun_static.lib zig-out/lib/fcae_zeptun_static.lib; do
            if [ -s "$candidate" ]; then STATIC_ZEPTUN="$candidate"; break; fi
          done
          if [ -z "$STATIC_ZEPTUN" ]; then
            echo "::error::Zig did not emit the uniquely named static zeptun archive"
            ls -la zig-out/lib
            exit 1
          fi
          if strings "$STATIC_ZEPTUN" | grep -qiE '(^|[^[:alnum:]_])zeptun\.dll([^[:alnum:]_]|$)'; then
            echo "::error::the uniquely named zeptun archive is an import library"
            exit 1
          fi
          cp "$STATIC_ZEPTUN" zig-out/lib/libzeptun.a
          rm -f zig-out/lib/*.dll zig-out/lib/*.dll.a zig-out/lib/*.so* zig-out/lib/*.dylib
          if ls zig-out/lib/*.dll zig-out/lib/*.dll.a >/dev/null 2>&1; then
            echo "::error::shared zeptun artifacts survived the purge:"
            ls -la zig-out/lib
            exit 1
          fi
          test -s zig-out/lib/libzeptun.a
      - name: build rust (engine + ffi, in-process)
        run: |
          set -euo pipefail
          rm -rf target/release/build/aether-engine-* target/debug/build/aether-engine-* 2>/dev/null || true
          cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target "$TARGET" -p fcae-ffi --features aether,tor,psiphon-live,zeptun,hev
          DEST="$(pwd)/target/$TARGET/release/libfcae_ffi.a"
          ls -lh "$DEST"
          test -f "$DEST"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTFLAGS: '-C target-feature=+crt-static -C link-args=-static-libgcc -C link-args=-static-libstdc++ -C link-args=-Wl,-Bstatic -C link-args=-lpthread -C link-args=-lwinpthread -C link-args=-Wl,-Bdynamic'

      - name: build frontend (windows)
        run: |
          rm -rf build
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DAETHER_TARGET=WIN_X64 \
            -DRUST_TARGET="$TARGET" \
            -DFCAE_VERSION_OVERRIDE="$FCAE_VERSION" \
            -DFCAE_IS_PRERELEASE="$FCAE_IS_PRERELEASE"
          cmake --build . --config Release
      - name: package
        run: |
          set -euo pipefail
          mkdir -p package
          EXE="Clubapp-windows-x64.exe"
          cp build/fcaevpn.exe "package/$EXE"
          cd package
          ls -la
          test -f "$EXE"
          IMPORTS="$(x86_64-w64-mingw32-objdump -p "$EXE" | awk '/DLL Name:/ { print $3 }' | sort -u)"
          echo "$EXE imports:"
          echo "$IMPORTS" | sed 's/^/  /'
          if echo "$IMPORTS" | grep -qiE '^(libhev-socks5-tunnel\.dll|libyaml\.so|liblwip\.so|libhev-task-system\.so|msys-2\.0\.dll|wintun\.dll|zeptun\.dll|libfcae_psiphon\.dll|libgcc_s_seh-1\.dll|libstdc\+\+-6\.dll|libwinpthread-1\.dll)$'; then
            echo "::error::$EXE imports a DLL that is supposed to be embedded or statically linked"
            exit 1
          fi
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: Clubapp-windows-x64
          path: package/*
          if-no-files-found: error
