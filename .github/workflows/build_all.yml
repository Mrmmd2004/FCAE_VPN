name: Clubapp APK (all ABIs)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Clubapp android-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v7a
            rust_targets: armv7-linux-androideabi
            target_triples: armv7-linux-androideabi
            zig_abis: armeabi-v7a
            hev_abis: armeabi-v7a
            gradle_abi: armeabi-v7a
            universal: false
          - name: v8a
            rust_targets: aarch64-linux-android
            target_triples: aarch64-linux-android
            zig_abis: arm64-v8a
            hev_abis: arm64-v8a
            gradle_abi: arm64-v8a
            universal: false
          - name: universal
            rust_targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android"
            target_triples: "aarch64-linux-android armv7-linux-androideabi x86_64-linux-android"
            zig_abis: "arm64-v8a armeabi-v7a x86_64 x86"
            hev_abis: "arm64-v8a armeabi-v7a x86_64"
            gradle_abi: ""
            universal: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FCAE_VERSION: "1.0.0"
      FCAE_VERSION_FULL: "1.0.0"
      FCAE_IS_PRERELEASE: "false"
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      # ---- Clubapp branding: name, icons, Telegram link, no links to the original author ----
      - name: apply Clubapp branding
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          pip install pillow numpy
          curl -fsSL -o /tmp/clubapp_icon.png \
            "https://raw.githubusercontent.com/Mrmmd2004/Clubapp/main/icon.png"
          python3 - <<'PY'
          import os, re
          import numpy as np
          from collections import deque
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          ROOT = "android/app/src/main"
          RES = ROOT + "/res"
          SRC = "/tmp/clubapp_icon.png"
          N = 1024
          # ---------------------------------------------------------------- master icon
          a = np.asarray(Image.open(SRC).convert("RGBA")).astype(float)
          rgb = a[..., :3]
          H, W = rgb.shape[:2]
          # white corners (connected to the 4 corners) are not part of the icon
          isw = rgb.min(axis=2) >= 245
          seen = np.zeros((H, W), bool)
          dq = deque([(0, 0), (0, W - 1), (H - 1, 0), (H - 1, W - 1)])
          for p in dq:
              seen[p] = True
          while dq:
              y, x = dq.popleft()
              for dy, dx in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                  ny, nx = y + dy, x + dx
                  if 0 <= ny < H and 0 <= nx < W and not seen[ny, nx] and isw[ny, nx]:
                      seen[ny, nx] = True
                      dq.append((ny, nx))
          body_obs = ~seen
          def rr_mask(r, size, ss=4):
              big = Image.new("L", (size * ss, size * ss), 0)
              ImageDraw.Draw(big).rounded_rectangle((0, 0, size * ss - 1, size * ss - 1), radius=r * ss * 1.0, fill=255)
              return np.asarray(big.resize((size, size), Image.LANCZOS)).astype(float) / 255
          R = min(range(10, 90), key=lambda r: np.abs((rr_mask(r, W) > 0.5) ^ body_obs).sum())
          print("corner radius:", R)
          yy, xx = np.mgrid[0:H, 0:W]
          u, v = xx / (W - 1), yy / (H - 1)
          def feats(u, v, deg=4):
              return np.stack([u**i * v**j for i in range(deg + 1) for j in range(deg + 1 - i)], axis=-1)
          white = rgb.min(axis=2)
          inner = (rr_mask(R, W) > 0.999) & (np.abs(xx - W / 2) < W / 2 - 6) & (np.abs(yy - H / 2) < H / 2 - 6)
          txt = np.asarray(Image.fromarray(((white >= 90) & inner).astype(np.uint8) * 255).filter(ImageFilter.MaxFilter(7))) > 0
          bgpix = inner & (white < 90) & ~txt
          A = feats(u[bgpix], v[bgpix])
          coef = [np.linalg.lstsq(A, rgb[..., c][bgpix], rcond=None)[0] for c in range(3)]
          U, V = np.meshgrid(np.linspace(0, 1, N), np.linspace(0, 1, N))
          F = feats(U, V)
          bg = np.stack([np.clip(F @ coef[c], 0, 255) for c in range(3)], axis=-1)
          # text = white pixels in the middle band only (keeps corner/edge noise out)
          wl = np.clip((white - 60) / (250 - 60), 0, 1)
          band = np.zeros((H, W), bool)
          band[int(H * 0.25):int(H * 0.8), int(W * 0.03):int(W * 0.97)] = True
          wl[~(inner & band)] = 0
          w_up = np.asarray(Image.fromarray((wl * 255).astype(np.uint8)).resize((N, N), Image.BICUBIC)).astype(float) / 255
          m = np.clip((w_up - 0.5) * 3.2 + 0.5, 0, 1)
          m = m * m * (3 - 2 * m)
          bg_img = Image.fromarray(bg.astype(np.uint8), "RGB").convert("RGBA")                 # full-bleed gradient
          txt_img = Image.merge("RGBA", [Image.new("L", (N, N), 255)] * 3 + [Image.fromarray((m * 255).astype(np.uint8))])
          big = Image.new("L", (N * 2, N * 2), 0)
          ImageDraw.Draw(big).rounded_rectangle((0, 0, N * 2 - 1, N * 2 - 1), radius=R * (N / W) * 2, fill=255)
          round_alpha = big.resize((N, N), Image.LANCZOS)
          icon_full = Image.alpha_composite(bg_img, txt_img)                                    # gradient + text
          icon_full.putalpha(round_alpha)                                                       # transparent corners
          def legacy(size, circle):
              img = icon_full.resize((size, size), Image.LANCZOS)
              if circle:
                  mask = Image.new("L", (size * 4, size * 4), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, size * 4 - 1, size * 4 - 1), fill=255)
                  mask = mask.resize((size, size), Image.LANCZOS)
                  img.putalpha(ImageChops.multiply(img.getchannel("A"), mask))
              return img
          # ---------------------------------------------------- adaptive icon resources
          ADAPT = 432
          fg = Image.new("RGBA", (N, N), (0, 0, 0, 0))
          s = int(N * 0.725)                       # text stays inside the 66% safe zone
          fg.paste(txt_img.resize((s, s), Image.LANCZOS), ((N - s) // 2, (N - s) // 2))
          dn = os.path.join(RES, "drawable-nodpi")
          os.makedirs(dn, exist_ok=True)
          bg_img.resize((ADAPT, ADAPT), Image.LANCZOS).convert("RGB").save(os.path.join(dn, "clubapp_ic_bg.png"))
          fg.resize((ADAPT, ADAPT), Image.LANCZOS).save(os.path.join(dn, "clubapp_ic_fg.png"))
          ADAPTIVE_XML = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/clubapp_ic_bg"/>
              <foreground android:drawable="@drawable/clubapp_ic_fg"/>
          </adaptive-icon>
          """
          names = {"ic_launcher", "ic_launcher_round"}
          try:
              man = open(ROOT + "/AndroidManifest.xml", encoding="utf-8").read()
              names |= set(re.findall(r'android:(?:icon|roundIcon)="@mipmap/([^"]+)"', man))
          except Exception as e:
              print("manifest not read:", e)
          v26 = os.path.join(RES, "mipmap-anydpi-v26")
          os.makedirs(v26, exist_ok=True)
          written = []
          for n in sorted(names):
              open(os.path.join(v26, n + ".xml"), "w").write(ADAPTIVE_XML)
              written.append(n + ".xml")
          for d in os.listdir(RES):                # any other adaptive-icon xml (v33 etc.)
              if d.startswith("mipmap-anydpi") and d != "mipmap-anydpi-v26":
                  for f in os.listdir(os.path.join(RES, d)):
                      p = os.path.join(RES, d, f)
                      if f.endswith(".xml") and "adaptive-icon" in open(p, encoding="utf-8").read():
                          open(p, "w").write(ADAPTIVE_XML)
                          written.append(d + "/" + f)
          print("Adaptive icon xml written:", written)
          # ------------------------------------------------------------ legacy bitmap icons
          def save_img(img, path):
              if path.lower().endswith(".webp"):
                  img.save(path, "WEBP", lossless=True)
              else:
                  img.save(path)
          icons = []
          for d, _, files in os.walk(RES):
              if "anydpi" in d or "drawable-nodpi" in d:
                  continue
              for f in files:
                  low = f.lower()
                  if not low.endswith((".png", ".webp")):
                      continue
                  p = os.path.join(d, f)
                  w, h = Image.open(p).size
                  if "launcher" in low and "foreground" not in low and "background" not in low:
                      save_img(legacy(w, "round" in low), p)
                      icons.append(p)
                  elif re.search(r"(^|_)(logo|splash|app_icon)(_|\.|$)", low):
                      side = min(w, h)
                      canvas = Image.new("RGBA", (w, h), (0, 0, 0, 0))
                      canvas.paste(legacy(side, False), ((w - side) // 2, (h - side) // 2))
                      save_img(canvas, p)
                      icons.append(p)
          print("Bitmaps replaced:", len(icons))
          for p in icons:
              print("  ", p)
          # ------------------------------------------------------ name + Telegram link
          tme, edited = set(), []
          for d, _, files in os.walk(ROOT):
              for f in files:
                  if not f.endswith((".xml", ".kt", ".java")):
                      continue
                  p = os.path.join(d, f)
                  try:
                      t = open(p, encoding="utf-8").read()
                  except Exception:
                      continue
                  n = t.replace("FCAE VPN", "Clubapp")
                  n = re.sub(r'(<string name="app_name"[^>]*>)[^<]*(</string>)', r'\1Clubapp\2', n)
                  tme.update(re.findall(r'https?://t\.me/[A-Za-z0-9_+]+', n))
                  n = re.sub(r'https?://t\.me/[A-Za-z0-9_+]+', 'https://t.me/Clubapp8', n)
                  if n != t:
                      open(p, "w", encoding="utf-8").write(n)
                      edited.append(p)
          print("Files edited:", len(edited))
          for p in edited:
              print("  ", p)
          print("Telegram links found and replaced:", sorted(tme))
          # --------------------- creator links -> Telegram, update source -> this fork
          REPO = os.environ.get("REPO_SLUG", "Mrmmd2004/FCAE_VPN")
          PAGE = re.compile(r'https?://(?:www\.)?github\.com/FCFlenkchy[^\s"\'<>)\\]*', re.I)
          SKIP = {"target", "build", ".gradle", "third_party", "node_modules", ".git"}
          EXT = (".kt", ".java", ".xml", ".rs", ".cpp", ".cc", ".c", ".h", ".hpp", ".mm", ".kts")
          link_edits, left = [], []
          for base in ("android/app/src/main", "src_cpp", "include", "core/fcae-ffi"):
              for d, dirs, files in os.walk(base):
                  dirs[:] = [x for x in dirs if x not in SKIP]
                  for f in files:
                      if not f.endswith(EXT):
                          continue
                      p = os.path.join(d, f)
                      try:
                          t = open(p, encoding="utf-8").read()
                      except Exception:
                          continue
                      n = PAGE.sub("https://t.me/Clubapp8", t)
                      n = re.sub(r"FCFlenkchy/FCAE_VPN", REPO, n, flags=re.I)
                      if n != t:
                          open(p, "w", encoding="utf-8").write(n)
                          link_edits.append(p)
                      for i, line in enumerate(n.splitlines(), 1):
                          if re.search(r"fcflenkchy", line, re.I):
                              left.append("%s:%d: %s" % (p, i, line.strip()[:110]))
          print("Creator-link files changed:", len(link_edits))
          for p in link_edits:
              print("  ", p)
          print("Lines still mentioning the creator:", len(left))
          for l in left[:40]:
              print("  ", l)
          # ------------------------------------------- what other images the app has
          cands = []
          for d, _, files in os.walk(RES):
              for f in files:
                  low = f.lower()
                  if low.endswith((".png", ".webp", ".jpg", ".jpeg")) and re.search(r"icon|logo|splash|banner|brand|fcae|mountain|header", low):
                      p = os.path.join(d, f)
                      try:
                          w, h = Image.open(p).size
                      except Exception:
                          continue
                      cands.append("%s (%dx%d)" % (p.replace(RES + "/", ""), w, h))
          print("Image files that look like logos:", len(cands))
          for c in sorted(cands)[:60]:
              print("  ", c)
          PY
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'core/psiphon/go.mod'
          cache: false

      - name: pin go toolchain
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          go version
          go env GOTOOLCHAIN
      - name: setup ndk
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
          components: rust-src

      - name: Build Psiphon Android AAR from pinned source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          PSIPHON_REV=$(git rev-parse HEAD:core/psiphon)
          test "$(git -C core/psiphon rev-parse HEAD)" = "$PSIPHON_REV"
          PSIPHON_GIT_DIR=$(git -C core/psiphon rev-parse --absolute-git-dir)
          echo "Building core/psiphon at $PSIPHON_REV"
          docker build --platform=linux/amd64 -t fcae-psiphon-android \
            -f core/psiphon/MobileLibrary/Android/Dockerfile core/psiphon/MobileLibrary
          docker run --platform=linux/amd64 --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GOCACHE=/tmp/go-cache \
            -e GIT_DIR=/psiphon-git \
            -e GIT_WORK_TREE=/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core \
            -e PSIPHON_REV="$PSIPHON_REV" \
            -v "$PSIPHON_GIT_DIR:/psiphon-git:ro" \
            -v "$ROOT/core/psiphon:/go/src/github.com/Psiphon-Labs/psiphon-tunnel-core" \
            fcae-psiphon-android /bin/bash -c '
              set -euo pipefail
              cd "$GIT_WORK_TREE/MobileLibrary/Android"
              test "$(git rev-parse HEAD)" = "$PSIPHON_REV"
              git rev-parse --short=10 HEAD
              ./make.bash
            '
          mkdir -p android/psiphon/libs
          cp core/psiphon/MobileLibrary/Android/ca.psiphon.aar android/psiphon/libs/
          INSPECT=$(mktemp -d)
          trap 'rm -rf "$INSPECT"' EXIT
          unzip -q android/psiphon/libs/ca.psiphon.aar 'jni/*' -d "$INSPECT"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            LIB="$INSPECT/jni/$ABI/libgojni.so"
            test -s "$LIB"
            readelf -lW "$LIB" | awk '$1 == "LOAD" { found=1; if ($NF != "0x4000") bad=1 } END { exit (!found || bad) }'
          done
      - name: fetch imgui
        run: |
          mkdir -p third_party
          if [ ! -d "third_party/imgui" ]; then
            git clone --depth 1 --branch v1.91.8 https://github.com/ocornut/imgui.git third_party/imgui
          fi
      - name: setup zig
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VER=0.16.0
          TUPLE=x86_64-linux
          SHA=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ARCHIVE="zig-${TUPLE}-${ZIG_VER}.tar.xz"
          PREFIX="${RUNNER_TOOL_CACHE}/zig-${ZIG_VER}"
          mkdir -p "$PREFIX"
          if [ ! -x "${PREFIX}/zig" ]; then
            file_sha() { sha256sum "$1" | awk '{print $1}'; }
            URLS=(
              "https://ziglang.org/download/${ZIG_VER}/${ARCHIVE}"
              "https://ziglang.freetls.fastly.net/${ARCHIVE}"
              "https://pkg.hexops.org/zig/${ARCHIVE}"
              "https://zig.linus.dev/zig/${ARCHIVE}"
              "https://zig.squirl.dev/${ARCHIVE}"
              "https://zig.mirror.mschae23.de/zig/${ARCHIVE}"
              "https://zigmirror.com/${ARCHIVE}"
              "https://zig.tilok.dev/${ARCHIVE}"
              "https://zigmirror.hryx.net/zig/${ARCHIVE}"
            )
            if list=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 \
                 https://ziglang.org/download/community-mirrors.txt 2>/dev/null); then
              while IFS= read -r base; do
                [ -n "$base" ] || continue
                URLS+=("${base%/}/${ARCHIVE}")
              done <<< "$list"
            fi
            TMP="${RUNNER_TEMP}/${ARCHIVE}"
            ok=0
            seen=
            for url in "${URLS[@]}"; do
              case " $seen " in *" $url "*) continue ;; esac
              seen+=" $url"
              echo "Trying $url"
              rm -f "$TMP"
              if curl -fL --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 20 --max-time 180 -o "$TMP" "$url" \
                   && [ "$(file_sha "$TMP")" = "$SHA" ]; then
                ok=1
                break
              fi
              echo "failed: $url"
            done
            if [ "$ok" != 1 ]; then
              echo "::error::failed to download Zig ${ZIG_VER} from every mirror"
              exit 1
            fi
            tar -xJf "$TMP" -C "$PREFIX" --strip-components=1
            rm -f "$TMP"
          fi
          echo "$PREFIX" >> "$GITHUB_PATH"
          "${PREFIX}/zig" version
      - name: build zeptun engine (libzeptun)
        shell: bash
        run: |
          set -euo pipefail
          cd core/zeptun
          SYSROOT="${ANDROID_NDK_HOME:?}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          test -d "$SYSROOT/usr/include"
          LIBC_DIR="$(mktemp -d)"
          trap 'rm -rf "$LIBC_DIR"' EXIT
          for abi in ${{ matrix.zig_abis }}; do
            case "$abi" in
              arm64-v8a)   ZIG_TARGET=aarch64-linux-android.24; NDK_TARGET=aarch64-linux-android ;;
              armeabi-v7a) ZIG_TARGET=arm-linux-androideabi.24; NDK_TARGET=arm-linux-androideabi ;;
              x86_64)      ZIG_TARGET=x86_64-linux-android.24; NDK_TARGET=x86_64-linux-android ;;
              x86)         ZIG_TARGET=x86-linux-android.24; NDK_TARGET=i686-linux-android ;;
            esac
            test -d "$SYSROOT/usr/include/$NDK_TARGET"
            test -f "$SYSROOT/usr/lib/$NDK_TARGET/24/libc.so"
            test -f "$SYSROOT/usr/lib/$NDK_TARGET/24/crtbegin_so.o"
            printf '%s\n' \
              "include_dir=$SYSROOT/usr/include" \
              "sys_include_dir=$SYSROOT/usr/include/$NDK_TARGET" \
              "crt_dir=$SYSROOT/usr/lib/$NDK_TARGET/24" \
              'msvc_lib_dir=' 'kernel32_lib_dir=' 'gcc_dir=' > "$LIBC_DIR/$abi.conf"
            zig build -Dtarget="$ZIG_TARGET" -Doptimize=ReleaseSmall -Dstrip=true \
              -Dandroid-libc="$LIBC_DIR/$abi.conf" --libc "$LIBC_DIR/$abi.conf" \
              --prefix "$PWD/zig-out/android/$abi"
            install -D -m 644 "zig-out/android/$abi/lib/libzeptun.a" \
              "zig-out/android/prebuilt/$abi/libzeptun.a"
          done
          if [[ -f zig-out/lib/zeptun.lib ]]; then
            mv zig-out/lib/zeptun.lib zig-out/lib/libzeptun.a
          fi
          rm -f zig-out/lib/*.dll zig-out/lib/*.dll.a zig-out/lib/*.so* zig-out/lib/*.dylib
          for abi in ${{ matrix.zig_abis }}; do
            test -s "zig-out/android/prebuilt/$abi/libzeptun.a"
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build hev-socks5-tunnel engine (libhev-socks5-tunnel)
        shell: bash
        run: |
          set -euo pipefail
          cd core/hev-socks5-tunnel
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            echo "::error::ANDROID_NDK_HOME not set, cannot build hev-socks5-tunnel"
            exit 1
          fi
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          ABIS="${{ matrix.hev_abis }}"
          STAGE="$RUNNER_TEMP/hev-android"
          rm -rf "$STAGE"
          for abi in $ABIS; do
            echo "  -> Building hev-socks5-tunnel for $abi"
            make clean
            case "$abi" in
              arm64-v8a)    CLANG_TARGET=aarch64-linux-android ;;
              armeabi-v7a)  CLANG_TARGET=armv7a-linux-androideabi ;;
              x86_64)       CLANG_TARGET=x86_64-linux-android ;;
              *) echo "::error::Unsupported Android ABI: $abi"; exit 1 ;;
            esac
            ANDROID_CFLAGS="-fPIC -DFD_SET_DEFINED -DSOCKLEN_T_DEFINED -Wno-error"
            if [ "$abi" = "armeabi-v7a" ]; then
              ANDROID_CFLAGS="$ANDROID_CFLAGS -mfpu=neon"
            fi
            make static \
              CC="$TOOLCHAIN/bin/${CLANG_TARGET}24-clang" \
              AR="$TOOLCHAIN/bin/llvm-ar" \
              STRIP="$TOOLCHAIN/bin/llvm-strip" \
              PP="$TOOLCHAIN/bin/${CLANG_TARGET}24-clang -E" \
              CFLAGS="$ANDROID_CFLAGS"
            mkdir -p "$STAGE/$abi"
            cp bin/libhev-socks5-tunnel.a \
               third-part/lwip/bin/liblwip.a \
               third-part/yaml/bin/libyaml.a \
               third-part/hev-task-system/bin/libhev-task-system.a \
               "$STAGE/$abi/"
          done
          for abi in $ABIS; do
            mkdir -p "bin/android/$abi"
            cp "$STAGE/$abi/"*.a "bin/android/$abi/"
            test -s "bin/android/$abi/libhev-socks5-tunnel.a"
          done
          ls -lh bin/android/*/lib*.a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: patch bridges (platform module, only if needed)
        if: matrix.universal != true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os

          BASE = "core/fcae-ffi/bridges/"

          def patch(p, add_stub):
              if not os.path.exists(p):
                  print("skip (missing):", p)
                  return
              s = open(p, encoding="utf-8").read()
              orig = s
              stub = "\n#[cfg(not(windows))]\npub mod platform {\n    pub fn is_privileged() -> bool {\n        true\n    }\n}\n"
              # Idempotency check must be specific to THIS stub, not any
              # "#[cfg(not(windows))]" in the file -- an unrelated block with
              # that same cfg elsewhere previously caused the stub to be
              # skipped, leaving platform gated to windows-only and Android
              # builds failing with E0433.
              if add_stub and stub.strip() not in s:
                  s = re.sub(r"(#\[cfg\(windows\)\]\s*mod platform;)", lambda m: m.group(1) + stub, s, count=1)
              # Preserve indentation: the previous "^mod platform" (no
              # capture group) only matched unindented declarations and
              # silently skipped indented ones.
              s = re.sub(r"(?m)^(\s*)mod platform", r"\1pub mod platform", s)
              if s != orig:
                  open(p, "w", encoding="utf-8").write(s)
                  print("patched:", p)
              else:
                  print("no change needed:", p)

          patch(BASE + "hev-socks5-tunnel/src/lib.rs", True)
          patch(BASE + "zeptun/src/lib.rs", False)
          PY

      - name: build rust (engine + ffi, in-process)
        run: |
          set -euo pipefail
          rm -rf target/release/build/aether-engine-* target/debug/build/aether-engine-* 2>/dev/null || true
          NDK="${ANDROID_NDK_HOME:-${{ steps.setup-ndk.outputs.ndk-path }}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "ANDROID_NDK_HOME not set or missing: $NDK"
            exit 1
          fi
          PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$PREBUILT/bin"
          export PATH="$BIN:$PATH"
          export ANDROID_NDK_HOME="$NDK"
          export ANDROID_NDK_ROOT="$NDK"
          for TARGET_TRIPLE in ${{ matrix.target_triples }}; do
            echo "  -> Building for $TARGET_TRIPLE"
            if [ "$TARGET_TRIPLE" = "aarch64-linux-android" ]; then
              NDK_CLANG_PREFIX=aarch64-linux-android
              RUST_ENV_LOWER=aarch64_linux_android
              RUST_ENV_UPPER=AARCH64_LINUX_ANDROID
              HEV_ABI=arm64-v8a
            elif [ "$TARGET_TRIPLE" = "x86_64-linux-android" ]; then
              NDK_CLANG_PREFIX=x86_64-linux-android
              RUST_ENV_LOWER=x86_64_linux_android
              RUST_ENV_UPPER=X86_64_LINUX_ANDROID
              HEV_ABI=x86_64
            else
              NDK_CLANG_PREFIX=armv7a-linux-androideabi
              RUST_ENV_LOWER=armv7_linux_androideabi
              RUST_ENV_UPPER=ARMV7_LINUX_ANDROIDEABI
              HEV_ABI=armeabi-v7a
            fi
            CLANG="$BIN/${NDK_CLANG_PREFIX}24-clang"
            CLANGXX="$BIN/${NDK_CLANG_PREFIX}24-clang++"
            export "CC_${RUST_ENV_LOWER}"="$CLANG"
            export "CXX_${RUST_ENV_LOWER}"="$CLANGXX"
            export "AR_${RUST_ENV_LOWER}"="$BIN/llvm-ar"
            export "CARGO_TARGET_${RUST_ENV_UPPER}_LINKER"="$CLANG"
            export "CARGO_TARGET_${RUST_ENV_UPPER}_AR"="$BIN/llvm-ar"
            ln -sf "$CLANG" "$BIN/${NDK_CLANG_PREFIX}-clang"
            ln -sf "$CLANGXX" "$BIN/${NDK_CLANG_PREFIX}-clang++"
            export CC="${NDK_CLANG_PREFIX}24-clang"
            export CXX="${NDK_CLANG_PREFIX}24-clang++"
            export AR=llvm-ar
            export "BINDGEN_EXTRA_CLANG_ARGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
            export "CFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
            export "CXXFLAGS_${RUST_ENV_LOWER}"="--sysroot=$PREBUILT/sysroot"
            export FCAE_HEV_LIBDIR="$(pwd)/core/hev-socks5-tunnel/bin/android/$HEV_ABI"
            export FCAE_ZEPTUN_LIBDIR="$(pwd)/core/zeptun/zig-out/android/prebuilt/$HEV_ABI"
            cargo build --manifest-path core/fcae-ffi/Cargo.toml --release --target "$TARGET_TRIPLE" -p fcae-ffi --features aether,tor,psiphon,zeptun,hev
            DEST="$(pwd)/target/$TARGET_TRIPLE/release/libfcae_ffi.a"
            ls -lh "$DEST"
            test -f "$DEST"
          done
          echo "All Android Rust targets built successfully"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: build apk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q --tries=3 --timeout=60 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          cd android
          gradle wrapper --gradle-version 9.6.0
          if [ "${{ matrix.universal }}" = "true" ]; then
            ./gradlew assembleRelease -PUNIVERSAL=true -PBUILD_TYPE=android_universal
          else
            cat > /tmp/abi.init.gradle <<'GRADLE'
          allprojects {
              plugins.withId('com.android.application') {
                  androidComponents.finalizeDsl { dsl ->
                      try {
                          dsl.defaultConfig.ndk.abiFilters.clear()
                          dsl.defaultConfig.ndk.abiFilters.add('${{ matrix.gradle_abi }}')
                          println "clubapp: abiFilters = " + dsl.defaultConfig.ndk.abiFilters
                      } catch (Throwable t) {
                          println "clubapp: abiFilters FAILED: " + t
                      }
                  }
              }
          }
          GRADLE
            ./gradlew -I /tmp/abi.init.gradle assembleRelease -PUNIVERSAL=true -PBUILD_TYPE=android_universal
          fi
      # No upstream secrets here: the APK is signed with a throw-away key made
      # on the spot, which is enough for a normal sideload install.
      - name: sign apk
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/clubapp.keystore -alias clubapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clubapp-pass -keypass clubapp-pass -dname "CN=Clubapp"
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" sign \
            --ks /tmp/clubapp.keystore \
            --ks-pass "pass:clubapp-pass" \
            --key-pass "pass:clubapp-pass" \
            --ks-key-alias clubapp \
            android/app/build/outputs/apk/release/*.apk
          "${BT}apksigner" verify --verbose android/app/build/outputs/apk/release/*.apk || true
      - name: inspect apk
        if: matrix.universal != true
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/*/ | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "${BT}apksigner" verify --verbose --print-certs "$APK" || true
          "${BT}aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
          echo "--- native libs in APK ---"
          unzip -l "$APK" | grep -E " lib/" || true
      - name: package
        run: |
          set -euo pipefail
          mkdir -p package
          cp android/app/build/outputs/apk/release/*.apk package/Clubapp-${{ matrix.name }}.apk
          ls -lah package/
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: Clubapp-apk-${{ matrix.name }}
          path: package/*
          if-no-files-found: error
